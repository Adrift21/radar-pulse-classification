[pytest]
# Only these directories hold real automated tests. They run without dataset.h5, so a
# fresh clone (and CI) can verify the pipeline immediately.
#
# NOTE: the `test_*.py` files under preprocessing/*/tests/ are NOT unit tests despite the
# name -- they are manual validation/figure scripts with a main() that require the 260 MB
# dataset. They are deliberately excluded from collection; run them directly instead, e.g.
#   python preprocessing/time_frequency/tests/test_stft_visualization.py
testpaths =
    tests
    models/tests

# Make the repo root importable so `pytest` works with no PYTHONPATH juggling.
pythonpath = .

addopts = -q
